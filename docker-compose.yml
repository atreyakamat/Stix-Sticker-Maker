services:
  backend:
    build: ./backend
    image: stix-backend
    container_name: stix-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Device: cpu is correct inside the Linux container (no DirectML here).
      - STIX_DEVICE=cpu
      # Startup/default model and the default quality tier.
      - STIX_MODEL=birefnet
      - STIX_DEFAULT_TIER=balanced
      # How many models to keep resident in RAM at once.
      - STIX_MODEL_CACHE=2
      - HF_HOME=/root/.cache/huggingface
    volumes:
      # Persist downloaded models across restarts/rebuilds.
      - stix_model_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        # Empty => same-origin requests proxied by nginx to the backend.
        VITE_API_BASE: ""
    image: stix-frontend
    container_name: stix-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  stix_model_cache:
